apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: ${JOBSET_NAME}
  namespace: default
  annotations:
    leaderworkerset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  replicas: ${REPLICAS}
  leaderWorkerTemplate:
    size: ${PARALLELISM}
    restartPolicy: RecreateGroupOnPodRestart
    workerTemplate:
      spec:
        nodeSelector:
          cloud.google.com/gke-tpu-accelerator: ${TPU_TYPE}
          cloud.google.com/gke-tpu-topology: ${TPU_TOPOLOGY}
        containers:
          - name: ${USER_CONTAINER}
            image: ${USER_CONTAINER_IMAGE}
            imagePullPolicy: Always
            env:
            - name: JAX_PLATFORMS
              value: ""
            - name: TPU_NODE_ID
              value: $$(LWS_WORKER_INDEX)
            - name: TPU_MULTIHOST_BACKEND
              value: ray
            command:
              - bash
              - -c
              - |
                # PID 1 wrapper: forwards SIGTERM to background child process so K8s
                # termination grace period shuts down workload cleanly without SIGKILL.
                # Polling sleep loop ensures bash wakes up promptly to run trap handler.

                echo "Program Start: $$(date)"
                _sigterm() (kill -SIGTERM $$! 2>/dev/null)
                trap _sigterm SIGTERM

                (
                  export JAX_COMPILATION_CACHE_DIR="$${JAX_COMPILATION_CACHE_DIR:-/tmp/jax_cache}"
                  export VLLM_XLA_CACHE_PATH="$${VLLM_XLA_CACHE_PATH:-$$JAX_COMPILATION_CACHE_DIR}"
                  mkdir -p "$$JAX_COMPILATION_CACHE_DIR"

                  if [ "$$LWS_WORKER_INDEX" = "0" ]; then
                    echo "Starting Ray Head..."
                    ray start --head --port=6379
                    sleep 5; until ray status; do sleep 5; done

                    ${STARTUP_COMMAND}
                  else
                    if [ -n "$${ROLLOUT_JAX_CACHE_GCS_DIR:-}$${JAX_CACHE_GCS_DIR:-}$${JAX_CACHE_BUCKET:-}$${BUCKET:-}$${MAXTEXT_OUTPUT_DIR:-}" ]; then
                      python3 -m tunix.experimental.common.gcs_cache download "$$JAX_COMPILATION_CACHE_DIR" "$${ROLLOUT_JAX_CACHE_GCS_DIR:-}" || true
                    fi
                    ray start --address=$${LWS_LEADER_ADDRESS}:6379 --block
                  fi
                ) & PID=$$!

                while kill -0 $$PID 2>/dev/null; do
                  sleep 5
                done
                wait $$PID
                EXIT_CODE=$$?

                echo "Program End: $$(date)"
                echo "EXIT_CODE=$$EXIT_CODE"
                exit $$EXIT_CODE
            resources:
              limits:
                google.com/tpu: "4"
                memory: "100Gi"
              requests:
                google.com/tpu: "4"
                memory: "100Gi"
            ports:
              - containerPort: ${USER_CONTAINER_PORT}
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              - mountPath: /tmp
                name: shared-tmp
        volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: shared-tmp
          hostPath:
            path: /tmp
            type: DirectoryOrCreate
